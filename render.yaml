services:
  - type: web
    name: quickquest-word-arena
    runtime: node
    plan: free
    rootDir: quickquest
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
